{% extends "base.html" %}
{% block title %}ورود | واتساپ کلون{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="bi bi-whatsapp"></i>
      <h3>واتساپ کلون</h3>
      <p class="text-muted">با شماره تماس وارد شوید</p>
    </div>

    <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginPane">ورود</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#registerPane">ثبت‌نام</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- ورود -->
      <div class="tab-pane fade show active" id="loginPane">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">شماره تماس</label>
            <input type="tel" class="form-control" name="phone" placeholder="+989121234567" required>
          </div>
          <div class="mb-3">
            <label class="form-label">رمز عبور</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button class="btn btn-success w-100" type="submit">ورود</button>
        </form>
      </div>

      <!-- ثبت‌نام -->
      <div class="tab-pane fade" id="registerPane">
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">نام</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">شماره تماس</label>
            <input type="tel" class="form-control" name="phone" placeholder="+989121234567" required>
          </div>
          <div class="mb-3">
            <label class="form-label">رمز عبور</label>
            <input type="password" class="form-control" name="password" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">بیو (اختیاری)</label>
            <input type="text" class="form-control" name="bio" maxlength="200">
          </div>
          <button class="btn btn-success w-100" type="submit">ثبت‌نام</button>
        </form>
      </div>
    </div>

    <div id="authError" class="alert alert-danger mt-3 d-none"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
